# bonsai/pack.yaml: the studio pack's Bonsai manifest, format bonsai.pack/1. Bonsai's engine reads it when a project
# links the pack (bonsai init, bonsai update) and when the pack's CI runs bonsai check --pack; Claude Code never reads
# it. It says who the pack is, what a machine needs, what the engine writes into a project (the fifteen walls on the
# studio's home, ~/.trinetra) and what the pack declares (the document kind brief). It carries no code: no hook line
# and no file the engine writes. Every key carries its comment, at its line's end or on the line just above;
# bonsai check --pack fails a key without one. Every field's full meaning, type and allowed values:
# bonsai check --schema bonsai.pack. Text that does not start with a letter is quoted (format-1 YAML). README.md says
# how a project takes the pack.
format: bonsai.pack/1                 # the format and its version, always the first key; only bonsai.pack/1
# id: the pack's id, equal to "name" in .claude-plugin/plugin.json; its skills load as studio:<name>, e.g.
# studio:desk-asks. Not "trinetra": that is the studio's machine namespace (contract section 5.1)
id: studio
# version: the pack's version, quoted, as X.Y.Z; a release tag must be "v" and this (v0.1.0). plugin.json never
# carries one: a project pins the pack by commit, and that commit is the version Claude Code sees
version: "0.1.0"
needs:                                # what a machine needs for the pack; bonsai status --json lists each
  # claude_code: the oldest Claude Code the pack works with, quoted: Bonsai's own floor, so the pack asks for no newer
  # one than Bonsai does; null: none of its own
  claude_code: "2.1.294"
# block: the pack's part of the instruction block in a project's CLAUDE.md, bonsai/block.md: two lines naming the
# skills and the walls. It loads in every session, so its docs stay in its own leading comment
block: block.md
files: []                             # no files: the pack writes nothing into a project but its block and walls
hooks: []                             # no hook lines: the pack carries no code that runs, so it links with --yes alone
# deny: the fifteen walls on the studio's home, ~/.trinetra: its token (the bridge's key to the server), its deploy
# key and its salt (the key of every input hash), each spelled five ways, for the five ways one machine reaches that
# home: this home (~/), the Windows home from WSL (//mnt/c/Users/*/), WSL's home from Windows by its two network names
# (//wsl.localhost/ and //wsl$/), and WSL's home through WSLg's mount of it (//mnt/wslg/distro/home/*/; a hand trial
# on 24 Oct 2026 found it reaches the real home). ci/check.sh deny holds this list to the fifteen, rule for rule
deny:
  - rule: "Read(~/.trinetra/token)"                                   # this home
    why: "Agents cannot read the token kept in ~/.trinetra/token."   # the preview's sentence
  - rule: "Read(~/.trinetra/deploy_ed25519)"                          # this home
    why: "Agents cannot read the deploy key kept in ~/.trinetra/deploy_ed25519."   # the preview's sentence
  - rule: "Read(~/.trinetra/salt)"                                    # this home
    why: "Agents cannot read the secret salt kept in ~/.trinetra/salt."   # the preview's sentence
  - rule: "Read(//mnt/c/Users/*/.trinetra/token)"                     # the Windows home, from WSL
    why: "Agents in WSL cannot read the Windows home's .trinetra/token."   # the preview's sentence
  - rule: "Read(//mnt/c/Users/*/.trinetra/deploy_ed25519)"            # the Windows home, from WSL
    why: "Agents in WSL cannot read the Windows home's .trinetra/deploy_ed25519."   # the preview's sentence
  - rule: "Read(//mnt/c/Users/*/.trinetra/salt)"                      # the Windows home, from WSL
    why: "Agents in WSL cannot read the Windows home's .trinetra/salt."   # the preview's sentence
  - rule: "Read(//wsl.localhost/*/home/*/.trinetra/token)"            # WSL's home, from Windows
    why: "Agents on Windows cannot read a WSL home's .trinetra/token through wsl.localhost."   # the preview's sentence
  - rule: "Read(//wsl.localhost/*/home/*/.trinetra/deploy_ed25519)"   # WSL's home, from Windows
    why: "Agents on Windows cannot read a WSL home's .trinetra/deploy_ed25519 through wsl.localhost."   # the preview's sentence
  - rule: "Read(//wsl.localhost/*/home/*/.trinetra/salt)"             # WSL's home, from Windows
    why: "Agents on Windows cannot read a WSL home's .trinetra/salt through wsl.localhost."   # the preview's sentence
  - rule: "Read(//wsl$/*/home/*/.trinetra/token)"                     # WSL's home, from Windows (wsl$)
    why: "Agents on Windows cannot read a WSL home's .trinetra/token through wsl$."   # the preview's sentence
  - rule: "Read(//wsl$/*/home/*/.trinetra/deploy_ed25519)"            # WSL's home, from Windows (wsl$)
    why: "Agents on Windows cannot read a WSL home's .trinetra/deploy_ed25519 through wsl$."   # the preview's sentence
  - rule: "Read(//wsl$/*/home/*/.trinetra/salt)"                      # WSL's home, from Windows (wsl$)
    why: "Agents on Windows cannot read a WSL home's .trinetra/salt through wsl$."   # the preview's sentence
  - rule: "Read(//mnt/wslg/distro/home/*/.trinetra/token)"            # WSL's home, through WSLg's mount
    why: "Agents in WSL cannot read the home's .trinetra/token through WSLg's mount, /mnt/wslg/distro."   # the preview's sentence
  - rule: "Read(//mnt/wslg/distro/home/*/.trinetra/deploy_ed25519)"   # WSL's home, through WSLg's mount
    why: "Agents in WSL cannot read the home's .trinetra/deploy_ed25519 through WSLg's mount, /mnt/wslg/distro."   # the preview's sentence
  - rule: "Read(//mnt/wslg/distro/home/*/.trinetra/salt)"             # WSL's home, through WSLg's mount
    why: "Agents in WSL cannot read the home's .trinetra/salt through WSLg's mount, /mnt/wslg/distro."   # the preview's sentence
# documents: the one document kind the pack declares, the daily brief, with its template in skill studio:brief. A
# project keeps its place in its bonsai.yaml's documents, under the kind's name. Only one linked pack may declare a
# kind (the engine refuses two), so a project takes this pack with a workflow pack that no longer declares brief
documents:
  - kind: brief                       # the daily brief for the person: the template in skill studio:brief
    path: work/briefs                 # its default folder, one file per day, named <date>.md
    file: null                        # a folder, not one file
    id: null                          # no ids: the file's name is its date
    statuses: []                      # no statuses
    person: []                        # no moves
    agent: []                         # no moves
    stamp: {}                         # no dates set by a move
    task_field: null                  # a brief belongs to no one task
protected: []                         # no protected paths of the pack's own: each project names its own in bonsai.yaml
roles: []                             # no roles: the pack's skills are read by any project's roles
